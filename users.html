<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Users Management</title>

    <link
        rel="stylesheet"
        href="style.css?v=17"
    >

</head>

<body data-page-permission="manage-users">

    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <div class="sidebar">

        <h2>
            DC System
        </h2>

        <a
            href="dashboard.html"
            data-i18n="dashboard"
        >
            Dashboard
        </a>

        <a
            href="projects.html"
            data-i18n="allProjects"
        >
            All Projects
        </a>
        <a
            href="users.html"
            class="active"
            data-permission="manage-users"
        >
            Users
        </a>
        
        <button
            type="button"
            id="logoutButton"
            data-i18n="logout"
        >
            Logout
        </button>

    </div>


    <!-- =====================================
         MAIN CONTENT
    ====================================== -->

    <div class="main-content">

        <!-- PAGE HEADER -->

        <div class="page-header">

            <div>

                <h1>
                    Users Management
                </h1>

                <p>
                    Create and manage system users and roles
                </p>

            </div>


            <button
                type="button"
                id="addUserButton"
                class="new-button"
                data-permission="manage-users"
            >
                + Add User
            </button>

        </div>


        <!-- =================================
             ADD / EDIT USER
        ================================== -->

        <div
            class="card"
            id="userFormCard"
        >

            <h2 id="userFormTitle">
                Add New User
            </h2>


            <div class="form-grid">

                <!-- NAME -->

                <div class="form-group">

                    <label for="userName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="userName"
                        placeholder="Enter Full Name"
                    >

                </div>
                <!-- USERNAME -->

                <div class="form-group">

                    <label for="userUsername">
                        Username
                    </label>

                    <input
                        type="text"
                        id="userUsername"
                        placeholder="Enter Username"
                        autocomplete="off"
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="userEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="userEmail"
                        placeholder="Enter Email Address"
                    >

                </div>


                <!-- ROLE -->

                <div class="form-group">

                    <label for="userRole">
                        Role
                    </label>

                    <select id="userRole">

                        <option value="">
                            Select Role
                        </option>

                        <option value="admin">
                            Admin
                        </option>

                        <option value="document-controller">
                            Document Controller
                        </option>

                        <option value="engineer">
                            Engineer
                        </option>

                        <option value="viewer">
                            Viewer
                        </option>

                    </select>

                </div>
                <!-- DISCIPLINE -->
                <div class="form-group">

                    <label for="userDiscipline">
                        Discipline
                    </label>

                    <select id="userDiscipline">

                        <option value="">
                            Select Discipline
                        </option>

                        <option value="all">
                            All Disciplines
                        </option>

                        <option value="civil">
                            Civil
                        </option>

                        <option value="architectural">
                            Architectural
                        </option>

                        <option value="electrical">
                            Electrical
                        </option>

                        <option value="mechanical">
                            Mechanical
                        </option>

                    </select>

                </div>

                <!-- STATUS -->

                <div class="form-group">

                    <label for="userStatus">
                        Status
                    </label>

                    <select id="userStatus">

                        <option value="Active">
                            Active
                        </option>

                        <option value="Inactive">
                            Inactive
                        </option>

                    </select>

                </div>


                <!-- TEMP PASSWORD -->

                <div class="form-group">

                    <label for="userPassword">
                        Temporary Password
                    </label>

                    <input
                        type="password"
                        id="userPassword"
                        placeholder="Set Temporary Password"
                         minlength="8"
                    >
                    <small id="passwordHelp" class="password-help">
                            Minimum 8 characters required.
                    </small>
                     <small id="passwordError" class="password-error"></small>

                </div>

            </div>


            <!-- ROLE PERMISSIONS -->

            <div
                id="rolePermissionsPreview"
                class="role-permissions-preview"
            >

                <strong>
                    Role Permissions
                </strong>

                <p id="rolePermissionsText">
                    Select a role to view permissions.
                </p>

            </div>


            <!-- FORM BUTTONS -->

            <div class="form-actions">

                <button
                    type="button"
                    id="cancelUserButton"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    id="saveUserButton"
                    class="new-button"
                >
                    Save User
                </button>

            </div>

        </div>


        <!-- =================================
             SYSTEM USERS
        ================================== -->

        <div class="card">

            <h2>
                System Users
            </h2>


            <div class="table-wrapper">

                <table
                    class="register-table users-table"
                >

                    <thead>

                        <tr>

                            <th>
                                S.No.
                            </th>

                            <th>
                                Name
                            </th>

                            <th>
                                Email
                            </th>

                            <th>
                                Role
                            </th>

                            <th>
                                Discipline
                            </th>    

                            <th>
                                Status
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="usersTableBody">

                        <tr>

                            <td
                                colspan="7"
                                class="no-data"
                            >
                                No users found.
                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <!-- =====================================
         JAVASCRIPT
    ====================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<script src="permissions.js?v=3"></script>
<script src="auth.js?v=5"></script>

<script src="users.js?v=8"></script>
<script src="language.js?v=3"></script>

</body>

</html>
