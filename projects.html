<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>All Projects</title>
    <link rel="stylesheet" href="style.css?v=15">
</head>

<body class="dashboard-body">

    <div class="sidebar">
        <img src="ALMAS LOGO.jpeg" alt="Company Logo" class="sidebar-logo">
        <h2>DC SYSTEM</h2>

        <a href="dashboard.html" data-i18n="dashboard">Dashboard</a>
        <a href="projects.html" class="active" data-i18n="allProjects">All Projects</a>
        <a
            href="users.html"
            data-permission="manage-users"
        >
            Users
        </a>

        <button
            type="button"
            id="logoutButton"
            class="logout-button"
            data-i18n="logout"
        >
            Logout
        </button>

    </div>

    <div class="main-content">

        <div class="top-header">
            <div>
                <h1 data-i18n="allProjects">All Projects</h1>
                <p data-i18n="createManageProjects">Create and manage projects</p>
            </div>
        </div>

        <div class="projects-toolbar">

    <h2 data-i18n="projects">Projects</h2>

    <button
        type="button"
        id="showCreateProject"
        class="create-project-button"
        data-permission="create-project"
    >
        <span data-i18n="createProject">+ Create Project</span>
    </button>

</div>


<div
    class="project-form-box"
    id="projectFormBox"
    style="display: none;"
>

            <h2>Add New Project</h2>
<label>Project Name</label>
<input type="text" id="projectName" placeholder="Enter Project Name">

<label>Project Code / Initial</label>
<input
    type="text"
    id="projectCode"
    maxlength="5"
    placeholder="Example: RP"
>

<label>Project No.</label>

            <div class="project-number-row">
                <input
                    type="text"
                    id="projectNumber"
                    maxlength="4"
                    placeholder="4 Digit Project No."
                >

                <button type="button" id="generateProjectNo">
                    Generate
                </button>
            </div>

            <button type="button" id="saveProject">
                Save Project
            </button>

            <p id="projectMessage"></p>

        </div>

        <div id="projectList" class="project-list">
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script src="permissions.js?v=3"></script>
    <script src="auth.js?v=4"></script>

    <script src="Projects.js"></script>
    <script src="language.js?v=3"></script>
    

</body>
</html>
