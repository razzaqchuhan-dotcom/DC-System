<!DOCTYPE html>
<html>
<head>
    <title>All Projects</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="dashboard-body">

    <div class="sidebar">
        <img src="ALMAS LOGO.jpeg" alt="Company Logo" class="sidebar-logo">
        <h2>DC SYSTEM</h2>

        <a href="dashboard.html">Dashboard</a>
        <a href="projects.html">All Projects</a>
    </div>

    <div class="main-content">

        <div class="top-header">
            <div>
                <h1>All Projects</h1>
                <p>Create and manage projects</p>
            </div>
        </div>

        <div class="project-form-box">

            <h2>Add New Project</h2>
<label>Project Name</label>
<input type="text" id="projectName" placeholder="Enter Project Name">

<label>Project Code / Initial</label>
<input
    type="text"
    id="projectCode"
    maxlength="5"
    placeholder="Example: RP"
>

<label>Project No.</label>

            <div class="project-number-row">
                <input
                    type="text"
                    id="projectNumber"
                    maxlength="4"
                    placeholder="4 Digit Project No."
                >

                <button type="button" id="generateProjectNo">
                    Generate
                </button>
            </div>

            <button type="button" id="saveProject">
                Save Project
            </button>

            <p id="projectMessage"></p>

        </div>


        <h2>Projects</h2>

        <div id="projectList" class="project-list">
        </div>

    </div>

    <script src="Projects.js"></script>

</body>
</html>
