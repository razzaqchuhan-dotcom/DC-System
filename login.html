<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>DC System Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <img src="ALMAS LOGO.jpeg" alt="Company Logo" class="company-logo">

        <h1>Document Controller Management System</h1>

        <div id="datetime"></div>

    <form id="loginForm">

        <label>Username</label>
        <input
            type="text"
            id="username"
            placeholder="Enter Username"
            required
    >

        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter Password"
            required
    >

        <button type="submit">Login</button>

        <p id="loginMessage"></p>

</form>
    </div>

    <script src="script.js"></script>

</body>
</html>
